name: iac-pr-opened

# Thin caller (IRD-016 §IaC pipelines). On a PR touching Terraform or Ansible:
#   - Terraform roots: fmt-check + validate + tflint + `plan` (per AFFECTED root) via
#     reusable-iac.yml@v6, assuming the read-only gha-iac-plan OIDC role; the plan is
#     posted as a PR comment + uploaded as an artifact for /review-plan (Agent C).
#   - Ansible: ansible-lint + yamllint gate on a PINNED control-node toolchain (MIN-52,
#     closes the TSG-020 version-skew debt).
# No stored AWS keys — auth is GitHub->AWS OIDC (role built from vars.AWS_ACCOUNT_ID).

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - "ansible/**"
      # ALL workflows, not just this one. Previously only `iac-pr-opened.yml` self-triggered,
      # so a change to iac-pr-merged / iac-manual / review-plan / why-failed reached `main`
      # with NO CI lint at all — including `guard-k3s-dev`, the cost control (MIN-56).
      - ".github/workflows/**"

concurrency:
  group: iac-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which roots does this PR affect? Each root is triggered by ONLY the modules it consumes
  # (see the filter below) — a change to one root's module never triggers the other (TSG-026).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      global: ${{ steps.filter.outputs.global }}
      k3s_dev: ${{ steps.filter.outputs.k3s_dev }}
      ansible: ${{ steps.filter.outputs.ansible }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Map each root to ONLY the modules it consumes (kept identical to iac-pr-merged so
          # plan + apply agree on which root a change affects). A broad `modules/**` over-triggered
          # every root — harmless at plan ($0) but it must match the merged filter that gates the
          # metered apply (TSG-026). Maintain: add a module line when a root starts consuming it.
          filters: |
            global:
              - 'envs/global/**'
              - 'modules/iam-github-oidc/**'
              - 'modules/dns/**'
              - 'modules/storage/**'
              - 'modules/cost-guardrails/**'
            k3s_dev:
              - 'envs/k3s-dev/**'
              - 'modules/network/**'
              - 'modules/compute-k3s/**'
            ansible:
              - 'ansible/**'
            workflows:
              - '.github/workflows/**'

  # SUNSET: this job + every `tf-vars:` block below is deleted by MIN-50 (private k3s
  # API via SSM port-forward) — no public 6443 rule means no admin_cidr to protect.
  # MIN-58 is a deliberate BRIDGE to unblock the Phase-3 gate. See IRD-016 §Sunset.
  #
  # MIN-58 — the pinned admin_cidr must actually EXIST before any k3s-dev terraform runs.
  # Without it `var.admin_cidr` is null, `envs/k3s-dev` falls back to auto-detecting the
  # runner's public IP, and the 6443 SG rule silently drifts to a throwaway address:
  # on `plan` that is a phantom diff on every PR forever, on `apply` it locks the operator
  # out of kubectl. FAILS RED on purpose — unlike `guard-k3s-dev` (a destroyed cluster is a
  # designed steady state, so it warns), a missing pin is a MISCONFIGURATION and must stop
  # the line. The whole point of MIN-58 is that a safeguard nothing forces to run is not a
  # safeguard; a fix that silently self-disables would repeat the same mistake.
  guard-tfvars:
    needs: changes
    if: needs.changes.outputs.k3s_dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ADMIN_CIDR secret must be set
        env:
          ADMIN_CIDR: ${{ secrets.ADMIN_CIDR }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_CIDR:-}" ]; then
            echo "::error::ADMIN_CIDR secret is not set. envs/k3s-dev would auto-detect the RUNNER's public IP for the 6443 security-group rule (MIN-58). Set it with: gh secret set ADMIN_CIDR --repo proops-task-management/iac-platform --body '<your-ip>/32'"
            exit 1
          fi
          echo "ADMIN_CIDR is set — TF_VAR_admin_cidr will pin the 6443 rule to the operator /32."

  plan-global:
    needs: changes
    if: needs.changes.outputs.global == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: proops-task-management/cicd-platform/.github/workflows/reusable-iac.yml@v6
    with:
      action: plan
      working-directory: envs/global
      aws-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-iac-plan
    secrets:
      # Passed to EVERY root uniformly: a root that does not declare `admin_cidr` silently
      # ignores its TF_VAR_ (unlike -var, which errors, or .tfvars, which warns). The caller
      # owns the variable NAME; the secret holds only the value (MIN-58).
      tf-vars: admin_cidr=${{ secrets.ADMIN_CIDR }}

  plan-k3s-dev:
    needs: [changes, guard-tfvars]
    if: needs.changes.outputs.k3s_dev == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: proops-task-management/cicd-platform/.github/workflows/reusable-iac.yml@v6
    with:
      action: plan
      working-directory: envs/k3s-dev
      aws-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-iac-plan
    secrets:
      # This is the root that actually consumes it — pinning `admin_cidr` here is what
      # removes the never-converging `<operator>/32 -> <runner>/32` diff from every PR plan.
      tf-vars: admin_cidr=${{ secrets.ADMIN_CIDR }}

  # MIN-52 — Ansible lint gate on a pinned control-node toolchain (TSG-020). No AWS, no cluster.
  ansible-lint:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned control-node toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Pinned to avoid the ansible-core 2.21 / collection skew from TSG-020.
          pip install "ansible-core==2.17.5" "ansible-lint==24.10.0" "yamllint==1.35.1"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint ansible/
      - name: ansible-lint
        run: ansible-lint ansible/

  # Workflow lint gate. actionlint resolves `needs.<job>.outputs.*` against the job that actually
  # declares them, validates `vars.`/`secrets.` contexts, and shellchecks every `run:` block — it
  # is what confirmed `guard-k3s-dev`'s wiring (MIN-56). Until 2026-07-28 it ran ONLY in the local
  # pre-commit hook, so a workflow edit committed without `task hooks` installed reached `main`
  # unchecked. .pre-commit-config.yaml claims "same tools + pins" parity with this workflow —
  # that was true for yamllint/ansible-lint but actionlint had no CI counterpart. Pinned to the
  # SAME rev as pre-commit (v1.7.1) so local and CI can never disagree (the TSG-020 lesson).
  workflow-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.1"   # keep in lockstep with .pre-commit-config.yaml
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: actionlint
        run: actionlint -color
      - name: yamllint (workflows)
        run: |
          set -euo pipefail
          pip install "yamllint==1.35.1"
          yamllint -c .yamllint.yaml .github/workflows/
