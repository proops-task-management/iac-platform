name: iac-manual

# Manual, guarded apply/destroy of a single Terraform root (IRD-016 §IaC pipelines).
# DESTROY IS MANUAL-ONLY and never runs automatically anywhere else. The `confirm` input
# must be typed to EXACTLY match `root` or the run aborts before touching AWS. Auth is the
# gha-iac-apply OIDC role (no stored AWS keys).
#
# THIS IS THE FIRST-CREATE PATH for the metered `envs/k3s-dev` root (MIN-56): `iac-pr-merged`
# is reconcile-only and skips `apply-k3s-dev` when no cluster exists, so building the cluster from
# empty state happens HERE (root=envs/k3s-dev, action=apply, confirm=envs/k3s-dev) — or by a local
# `terraform apply` in that root — always with a human confirming the meter (~$1/day). The
# `confirm==root` guard below is that human step; nothing here runs automatically.
#
# NOT `scripts/cluster-up.sh`: that script is stopped -> running only. It discovers instances by
# tag and hard-fails ("instances not found by tag — is envs/k3s-dev applied?") against empty state,
# so it cannot create. After a `terraform destroy` the order is: apply (here) -> cluster-up.sh.

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Terraform root to operate on"
        type: choice
        required: true
        options:
          - envs/global
          - envs/k3s-dev
      action:
        description: "apply | destroy"
        type: choice
        required: true
        options:
          - apply
          - destroy
      confirm:
        description: "Type the root again to confirm (must equal `root`)"
        type: string
        required: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm matches root
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${{ inputs.root }}" ]; then
            echo "::error::confirm ('${{ inputs.confirm }}') must exactly equal root ('${{ inputs.root }}'). Aborting."
            exit 1
          fi
          echo "Confirmed: ${{ inputs.action }} on ${{ inputs.root }}"

      # SUNSET: this step + the `tf-vars:` block on the `run` job are deleted by MIN-50
      # (private k3s API via SSM port-forward). See IRD-016 §Sunset.
      #
      # MIN-58 — this is the FIRST-CREATE path for the metered root, so it is the run most
      # likely to write the 6443 rule from scratch. Without a pinned admin_cidr the root
      # auto-detects the RUNNER's public IP and the freshly created cluster is unreachable
      # by kubectl from the moment it exists. Folded into the existing guard job rather than
      # a separate one: iac-manual already has a human-confirmation gate, and this is the
      # same class of pre-flight check.
      - name: ADMIN_CIDR secret must be set (metered root only)
        if: inputs.root == 'envs/k3s-dev'
        env:
          ADMIN_CIDR: ${{ secrets.ADMIN_CIDR }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_CIDR:-}" ]; then
            echo "::error::ADMIN_CIDR secret is not set. This ${{ inputs.action }} on envs/k3s-dev would bind the 6443 rule to the RUNNER's IP, leaving the cluster unreachable by kubectl (MIN-58). Set it with: gh secret set ADMIN_CIDR --repo proops-task-management/iac-platform --body '<your-ip>/32'"
            exit 1
          fi
          echo "ADMIN_CIDR is set — TF_VAR_admin_cidr will pin the 6443 rule to the operator /32."

  run:
    needs: guard
    permissions:
      id-token: write
      contents: read
      pull-requests: write   # reusable-iac@v6 declares this; caller must grant ≥ what the reusable requests (same contract as iac-pr-merged)
    uses: proops-task-management/cicd-platform/.github/workflows/reusable-iac.yml@v6
    with:
      action: ${{ inputs.action }}
      working-directory: ${{ inputs.root }}
      aws-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-iac-apply
    secrets:
      # Passed unconditionally — `root` is a RUNTIME input, so a reusable-workflow call
      # cannot pass the secret selectively. Safe: a root that does not declare `admin_cidr`
      # silently ignores its TF_VAR_ (unlike -var, which errors, or .tfvars, which warns).
      tf-vars: admin_cidr=${{ secrets.ADMIN_CIDR }}
