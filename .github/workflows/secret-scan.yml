name: secret-scan

# The secret gate for this repo (IRD-021 · MIN-62). DELIBERATELY a separate workflow from
# iac-pr-opened.yml, and DELIBERATELY without a `paths:` filter.
#
# WHY NOT a job inside iac-pr-opened.yml: that workflow is paths-triggered (envs/**, modules/**,
# ansible/**, scripts/**, .github/workflows/**). A credential can land in ANY file — a README, a
# .env.example, a stray .json — so a secret gate sitting behind a path filter is a gate wired to
# a trigger that does not always fire. That is exactly the MIN-60 defect, and the secret gate is
# the worst possible place to repeat it. Every PR and every push to main, no filter, no excuses.
#
# WHY the local pre-commit hook is not enough: it is bypassable three ways, none of which touch
# a developer machine — a clone that never ran `task hooks` (per-clone and silently optional,
# IRD-014 §Local gate), `git commit --no-verify`, and an edit made through the GitHub web UI or
# by an agent. A lint miss is a bug; a secret miss is a credential in immutable git history.
#
# WHY the shared composite action and NOT gitleaks/gitleaks-action@v2: that Action refuses to run
# on ORGANIZATION accounts without a paid GITLEAKS_LICENSE, and this repo is org-owned — TSG-005,
# ~20 min lost at D3 before the binary workaround was found. cicd-platform's gitleaks-scan action
# runs the Apache-2.0 BINARY directly, which carries no such restriction. Reusing it keeps that
# fix in ONE place for all seven repos instead of re-deriving it here.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # VERSION IS PASSED EXPLICITLY, not left to the action's default. That default is 8.18.4
      # today, which happens to match — but relying on it would put THIS repo's lockstep with its
      # OWN .pre-commit-config.yaml at the mercy of an edit in another repo. Pinned here, next to
      # the rule it has to satisfy. Bump both in one commit or not at all (the TSG-020 lesson).
      #
      # SCOPE — a deliberate choice, not a default (MIN-62 AC-3). The action runs
      # `gitleaks detect --no-git`: it scans the CHECKED-OUT TREE, not git history. Chosen because
      # (a) it is what all 5 service repos already run via reusable-java-ci / reusable-node-ci,
      # and a scan scope that differs in one repo is its own drift; (b) it is robust on the
      # shallow checkouts Actions performs; (c) a full-history scan re-litigates every past commit
      # on every PR, so a single pre-existing finding would block all work until someone widened
      # an allowlist — the exact move TSG-010 forbids.
      # KNOWN HOLE, stated rather than papered over: a secret committed and then deleted in a
      # LATER commit on the same branch survives in history and passes a tree scan. That case is
      # covered one layer earlier — the pre-commit hook scans STAGED changes, before the secret
      # can enter a commit at all. The two scopes are complementary; neither alone is total.
      #
      # RULESET — gitleaks' DEFAULT rules, deliberately. No .gitleaks.toml exists in this repo or
      # any other in the program, despite IRD-019/021 referring to an allowlist (see MIN-41 and
      # the IRD-021 correction that ships with this change). Creating an empty one now would be
      # worse than having none: an allowlist that exists is an invitation to widen it, and
      # TSG-010's standing rule is to fix the SOURCE and never broaden the rule. If a false
      # positive ever genuinely needs muting, scope it to a single finding fingerprint in
      # .gitleaksignore — never a rule-wide or path-wide mute.
      - name: Scan for committed secrets (gitleaks)
        uses: proops-task-management/cicd-platform/.github/actions/gitleaks-scan@v6
        with:
          version: "8.18.4"   # keep in lockstep with .pre-commit-config.yaml rev v8.18.4
