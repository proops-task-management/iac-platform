# .pre-commit-config.yaml — iac-platform
# Local pre-commit gate (mirrors cicd-platform's). Lints YAML + Ansible + workflow syntax +
# shell scripts + Terraform, and blocks committed secrets before they reach CI or history.
# Install once:
#   pre-commit install          # then hooks run on every `git commit`
#   pre-commit run --all-files  # one-off full sweep
# Pre-commit fetches each tool into its OWN managed env — nothing is installed on your PATH,
# and the operator ansible .venv is never touched. ONE named exception: `terraform-fmt` uses
# the `terraform` already on your PATH (see that hook for why — MIN-69).
#
# CI PARITY — stated per tool, not as a blanket claim (MIN-60). This file used to say
# "same tools + pins" as the in-CI gate; that was FALSE for actionlint (added to CI 2026-07-28)
# and for shellcheck (which existed in neither place). A parity claim nobody can check is the
# same defect class as a safeguard nothing forces to run — so the truth is tabulated:
#
#   hook          | in-CI counterpart                           | pinned in lockstep?
#   --------------|---------------------------------------------|--------------------
#   yamllint      | iac-pr-opened: ansible-lint + workflow-lint  | yes — 1.35.1
#   ansible-lint  | iac-pr-opened: ansible-lint (core 2.17.5)    | yes — 24.10.0
#   actionlint    | iac-pr-opened: workflow-lint                 | yes — 1.7.1
#   shellcheck    | iac-pr-opened: script-lint                   | yes — 0.10.0
#   brace-guard   | iac-pr-opened: script-lint (same script)     | structural
#   gitleaks      | secret-scan.yml — OWN workflow, no paths:    | yes — 8.18.4 (MIN-62)
#   check-action-pins | action-pins.yml — OWN workflow, no paths: | STRUCTURAL — one script, in
#                     |                                          | cicd-platform (MIN-65)
#   terraform-fmt | plan-*: reusable-iac.yml@v6 "Terraform fmt   | NO — PATH terraform vs CI
#                 | (check)" — same command, repo root          | 1.9.8; accepted (MIN-69)
#   tflint        | plan-*: reusable-iac.yml@v6 "TFLint", per    | yes — 0.53.0 (MIN-69)
#                 | root, no .tflint.hcl on either side          |
#
# The two Terraform rows' CI side lives in ANOTHER repo (cicd-platform), not in this repo's
# workflows — so bumping tflint here means bumping `tflint_version` in reusable-iac.yml and
# re-cutting @v6 in the same change set. "Same commit" is impossible across repos; "same
# release" is the rule.
#
# The gitleaks row is deliberately NOT in iac-pr-opened.yml like the other five. That workflow is
# paths-triggered, and a secret can land in any file — a README, a stray .json — so a secret gate
# behind a path filter is a gate that does not always fire (the MIN-60 defect). It gets its own
# unfiltered workflow. The other five are lint gates whose subject matter IS the filtered paths.
#
# Bumping any pin here MUST bump the CI counterpart in the same commit (the TSG-020 lesson).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks               # scan staged changes for credentials (IRD-021)

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]

  - repo: https://github.com/ansible/ansible-lint
    rev: v24.10.0
    hooks:
      - id: ansible-lint           # uses .ansible-lint; matches the CI pin
        language_version: python3.12          # 2.17.5 supports <=3.12; py3.14 breaks the import
        additional_dependencies:
          - "ansible-core==2.17.5"            # pin the matched toolchain (TSG-020 / MIN-52) —
                                              # without this pre-commit pulls a too-new ansible-core

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint             # validate .github/workflows/*.yml syntax + expressions

  # MIN-65 — the SUPPLY-CHAIN half of the workflow gate. actionlint checks SYNTAX, and
  # `uses: actions/checkout@v7` is both valid YAML and a mutable reference: the publisher can
  # repoint that tag and this repo's apply job — which assumes gha-iac-apply — runs new code
  # with no diff here. Third-party `uses:` must therefore be a full commit SHA + `# vX.Y.Z`.
  #
  # NOT a local copy of the script. The implementation lives once in cicd-platform and is
  # consumed here through ITS .pre-commit-hooks.yaml, so this hook, cicd-platform's own hook,
  # its self-ci GATE 4 and this repo's action-pins.yml all exec ONE file — copying it would
  # create exactly the drift MIN-65 exists to prevent.
  #
  # `rev:` IS AN IMMUTABLE TAG ON PURPOSE, unlike the @v6 the CI side consumes: pre-commit
  # resolves a ref at install time and caches it, so a moving tag would leave every clone on
  # whatever @v6 meant the day it was installed — a silent, per-machine version. Dependabot does
  # not update pre-commit revs; bump this by hand when @v6 moves (same rule as the gitleaks
  # version duplicated in cicd-platform's self-ci.yml).
  - repo: https://github.com/proops-task-management/cicd-platform
    rev: v6.7
    hooks:
      - id: check-action-pins      # third-party actions must be SHA-pinned + version-commented

  # MIN-60 / TSG-028 — the daily-ops bash suite (scripts/*.sh) previously had NO lint gate.
  # actionlint shellchecks `run:` blocks, but only INSIDE workflow files; standalone .sh got
  # nothing, so `task check` was green while cluster-up.sh carried a fatal expansion bug.
  #
  # WHY shellcheck-py AND NOT koalaman/shellcheck-precommit: the koalaman hook is
  # `language: docker_image` — it needs a running Docker daemon, which would make the local
  # gate fail on a laptop with Docker Desktop closed and contradicts this file's own promise
  # that every tool lives in a pre-commit-managed env and nothing lands on your PATH.
  # shellcheck-py ships the SAME upstream binary via pip, matching the yamllint/ansible-lint
  # pattern already used here. rev v0.10.0.1 == shellcheck 0.10.0 — the version the CI
  # script-lint job downloads (lockstep; keep the two in sync when bumping).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck             # lint scripts/*.sh (severity: style — full strictness)

  # MIN-60 AC-4 — the check shellcheck CANNOT do, so it is not delegated to prose.
  # Probing shellcheck 0.10.0 with TSG-028's exact line (`$PUBLIC_IP` + U+2026) returned a
  # CLEAN PASS: it parses Unicode text, while bash resolves identifiers byte-wise and folds
  # the ellipsis's leading 0xE2 into the name. So the shellcheck hook above does NOT cover
  # the defect that created this issue. Writing the brace rule into IRD-014 and stopping
  # there would have been MIN-58's mistake again — a rule with nothing behind it.
  #
  # `repo: local` is deliberate: this hook and the `script-lint` CI job exec the SAME
  # scripts/lint-brace-guard.sh, so the two cannot drift. Lockstep here is structural (one
  # file) rather than two version pins someone must remember to bump together.
  - repo: local
    hooks:
      - id: brace-guard
        name: brace-guard (TSG-028 — unbraced $VAR next to non-ASCII)
        entry: scripts/lint-brace-guard.sh
        language: script
        types: [shell]

  # MIN-69 — the two Terraform gates CI has run since D11 had NO local twin: a contributor
  # learned about a fmt or tflint violation only in CI — and a Terraform change made during
  # a metered window learned about it with the AWS meter running.
  #
  # WHY `repo: local` AND NOT antonbabenko/pre-commit-terraform: its hooks exec whatever
  # `terraform` and `tflint` are on your PATH. `brew` installs the LATEST tflint, so the
  # v0.53.0 lockstep with CI could not hold — the exact local/CI version skew TSG-020 was.
  # Any `docker_image` hook is rejected for the same reason koalaman's shellcheck was
  # (MIN-60): the gate would break whenever Docker Desktop is closed.
  - repo: local
    hooks:
      # CHECK-ONLY, never rewrites (MIN-69 Q2): identical to CI's "Terraform fmt (check)",
      # so the hook can never silently edit a file mid-commit. Fix with `task fmt`.
      # Whole-repo `-recursive`, not per-file: that is the command CI runs, so the two
      # cannot disagree about scope.
      #
      # THE ONE `language: system` HOOK — a deliberate exception to "nothing on your PATH".
      # tflint below can be built by pre-commit; terraform cannot: hashicorp/terraform's
      # go.mod carries 9 `replace` directives (v1.9.8), and `go install` refuses any module
      # that has them. It adds no new dependency either — terraform on PATH is already a
      # hard operator prerequisite (`task validate`, cluster-up.sh, every plan/apply).
      # Accepted residual: local terraform is unpinned vs CI's 1.9.8. fmt output has been
      # stable across 1.x, and required_version (>= 1.7, < 2.0) bounds it.
      - id: terraform-fmt
        name: terraform fmt (check — same command as reusable-iac@v6)
        entry: terraform fmt -check -recursive -diff
        language: system
        files: \.(tf|tfvars)$
        pass_filenames: false

      # `language: golang` builds tflint FROM SOURCE at the exact CI pin into pre-commit's
      # own env (bootstrapping Go if the machine has none) — so the promise at the top of
      # this file holds and the version is v0.53.0 by construction, not by what you
      # installed. First run compiles (~1-3 min, needs network); cached afterwards.
      # The wrapper script mirrors CI's per-root invocation and prints `tflint --version`
      # on every run, so the lockstep is checked from output, not from this line.
      - id: tflint
        name: tflint (v0.53.0, per root — same as reusable-iac@v6)
        entry: scripts/lint-tflint.sh
        language: golang
        additional_dependencies:
          - github.com/terraform-linters/tflint@v0.53.0   # lockstep: reusable-iac.yml tflint_version
        files: (\.tf|\.tflint\.hcl)$
        pass_filenames: false
        verbose: true
