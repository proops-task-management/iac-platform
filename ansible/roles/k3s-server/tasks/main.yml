---
# k3s-server — install the pinned server, publish token + private IP to SSM,
# fetch a URL-rewritten kubeconfig for the localhost bootstrap (P0-2b).
# Runs over SSM as root (play sets become: true).

- name: Ensure the k3s config dir exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"

# Every SAN here is STABLE across a stop/start, so this template renders byte-identical
# every morning → no `Restart k3s` → a true `changed=0` (AC-10-17, MIN-54).
# MIN-50 / ADR-017: the API is reached through an SSM port-forward on 127.0.0.1, so the
# SANs are 127.0.0.1 + the PRIVATE IP (the agent joins node-to-node on it). No public IP
# (churns daily) and no domain name (a free domain must not gate cluster access).
# Expect ONE `changed` + k3s restart on the first run after MIN-50 (SANs shrank); the
# second run must be changed=0.
- name: Render k3s server config (tls-san = 127.0.0.1 + private IP)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_file }}"
    mode: "0644"
  vars:
    k3s_tls_san: "{{ k3s_tls_san_static + [ansible_default_ipv4.address] }}"
  notify: Restart k3s

- name: Install k3s server (pinned; Traefik ON; reads config.yaml)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL {{ k3s_install_url }} | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s          # P0-3: skip if installed → second-run changed=0
  # NOTE: `creates` also skips a VERSION BUMP (binary exists). Fine for the D10 fresh
  # install; a later k3s upgrade needs a `k3s --version`-aware guard (tracked, not here).

- name: Wait for the k3s API to be Ready on 6443 (P1-8)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 180

- name: Wait for the node-token file to exist before reading it (P1-8)
  ansible.builtin.wait_for:
    path: "{{ k3s_node_token_path }}"
    timeout: 120

- name: Read the k3s node-token
  ansible.builtin.slurp:
    src: "{{ k3s_node_token_path }}"
  register: k3s_node_token_b64
  no_log: true                            # secret — never print (P1-7)

# The two SSM WRITES run on the CONTROL node (delegate_to localhost), NOT on the k3s
# node: (1) the node's IAM role is read-only on SSM (`ssm:GetParameter*`, no
# `ssm:PutParameter`) — writing from the node would fail AccessDenied; (2) the node
# has no boto3. The controller has both the creds and boto3 (venv). This mirrors the
# agent role's controller-side SSM *lookup*. `become: false` so we don't sudo on the Mac.
# The `value` vars resolve from the node's facts (delegate_facts defaults off).
- name: Publish node-token to SSM as SecureString (P1-7)
  community.aws.ssm_parameter:
    name: "{{ k3s_token_ssm_path }}"
    value: "{{ k3s_node_token_b64.content | b64decode | trim }}"
    type: SecureString
    region: "{{ aws_region }}"
    # default overwrite_value=changed → writes only when the value differs → idempotent
  delegate_to: localhost
  become: false
  no_log: true

- name: Publish server private IP to SSM (agent join target)
  community.aws.ssm_parameter:
    name: "{{ k3s_server_ip_ssm_path }}"
    value: "{{ ansible_default_ipv4.address }}"
    type: String
    region: "{{ aws_region }}"
  delegate_to: localhost
  become: false

# --- Fetch + rewrite kubeconfig for the localhost bootstrap / operator (P0-2b) -----
- name: Slurp the server kubeconfig
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_remote }}"
  register: k3s_kubeconfig_b64
  no_log: true

- name: Ensure the local artifact dir exists (control node)
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  connection: local
  become: false

- name: Write the kubeconfig locally (server → 127.0.0.1:<local port>, via the SSM tunnel)
  ansible.builtin.copy:
    # MIN-50 / ADR-017: on the control node, 127.0.0.1:<k3s_api_local_port> is the local end
    # of scripts/k8s-tunnel.sh, which forwards to the node's 6443. k3s already writes
    # https://127.0.0.1:6443, so at the default port this replace is a no-op; it stays so the
    # local port can move off 6443 if something else on the Mac holds it. 127.0.0.1 is a
    # tls-san entry, so the cert check passes.
    # PREREQUISITE: the tunnel must be up before anything USES this file — cluster-up.sh
    # runs `k8s-tunnel.sh ready` between `--tags nodes` and `--tags bootstrap`.
    content: >-
      {{ k3s_kubeconfig_b64.content | b64decode
         | replace('https://127.0.0.1:6443',
                   'https://' ~ k3s_api_host ~ ':' ~ k3s_api_local_port) }}
    dest: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  connection: local
  become: false
  no_log: true
