---
# k3s-agent — join the cluster using the token + server IP the server published to
# SSM. Runs over SSM as root (play sets become: true). The SSM reads use the CONTROL
# node's creds (amazon.aws.aws_ssm lookup runs locally), evaluated after the server
# play (P0-1 ordering) has written the params — so the values always exist here.

- name: Resolve the join token + server IP from SSM (on the control node)
  ansible.builtin.set_fact:
    k3s_join_token: "{{ lookup('amazon.aws.aws_ssm', k3s_token_ssm_path, region=aws_region, decrypt=True) }}"
    k3s_join_url: "https://{{ lookup('amazon.aws.aws_ssm', k3s_server_ip_ssm_path, region=aws_region) }}:6443"
  no_log: true                            # token is a secret — never print (P1-7)

- name: Install k3s agent (pinned) and join the server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      K3S_URL={{ k3s_join_url }} \
      K3S_TOKEN={{ k3s_join_token }} \
      sh -s - agent
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s          # P0-3: skip if installed → second-run changed=0
  no_log: true                            # token appears on the command line — never print

- name: Wait for the agent kubelet to come up (joined) (P1-8)
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/agent/kubelet.kubeconfig
    timeout: 120
