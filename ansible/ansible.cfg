# Ansible project config — SSM-shaped, NOT SSH-shaped (P1-6 / iac-basics §6).
# No [ssh_connection] block: pipelining/control_path are SSH-only and have no
# effect over community.aws.aws_ssm — deliberately omitted (no cargo-culting).
# NOTE: INI values do NOT support trailing inline comments — Ansible reads the
# rest of the line as part of the value. Keep every comment on its OWN line.
[defaults]
inventory                = ./inventory/aws_ec2.yml
roles_path               = ./roles
# stdout callback: ansible-core built-in `default`. NOT community.general's `yaml`
# callback — its `MyDumper(AnsibleDumper)` subclass breaks on ansible-core >= 2.19
# (AnsibleDumper was reworked), and our pinned community.general 9.0.1 predates that.
# `default` is cosmetic-equivalent enough and carries no cross-version fragility.
# TODO (tech-debt): align the toolchain — pin ansible-core to the pinned collections'
# era (< 2.19) OR bump the collections to a core-2.21-compatible set — then `yaml`
# can return if wanted. Tracked in TSG-020.
stdout_callback          = default
# per-task timing
callbacks_enabled        = ansible.posix.profile_tasks
# cache facts across plays
gathering                = smart
fact_caching             = jsonfile
fact_caching_connection  = /tmp/proops_ansible_fact_cache
fact_caching_timeout     = 3600
interpreter_python       = /usr/bin/python3
# vestigial under SSM (no SSH host key); kept for clarity
host_key_checking        = False
forks                    = 10
retry_files_enabled      = False
# per-play override in site.yml (server play = fatal)
any_errors_fatal         = False
# run already-notified handlers even if a play aborts (task failure / any_errors_fatal).
# our handlers (Restart k3s, Restart journald) gate on a `changed` config write, so a
# dropped notification is UNRECOVERABLE: the next converge sees the config unchanged,
# never re-notifies, and the restart is lost silently. Safe here — both restart only
# AFTER their config file is fully written (no half-config, no destructive action).
force_handlers           = True

[inventory]
enable_plugins = amazon.aws.aws_ec2
