---
# Cross-role shared values (NO secrets, NO connection vars — those live in k3s.yml).
# Secret VALUES never appear here; only SSM paths (IRD-019 / P1-7).
aws_region: ap-southeast-1

# --- k3s (pinned — iac-basics §5). Verify against https://github.com/k3s-io/k3s/releases
#     before the Step-3 run; bumping is a one-line change here. ---
k3s_version: "v1.31.5+k3s1"
k3s_token_ssm_path:     /proops/dev/k3s/token       # SecureString (P1-7)
k3s_server_ip_ssm_path: /proops/dev/k3s/server-ip

# --- Cluster identity / TLS (P0-2b → MIN-54 → MIN-50 / ADR-017).
#     The k3s API is NOT reachable from the internet. Operator kubectl and the Play-4
#     Argo CD bootstrap reach it through an SSM port-forward on 127.0.0.1
#     (scripts/k8s-tunnel.sh), so the kubeconfig targets 127.0.0.1:<local port>.
#     History, so it is not re-litigated: D10 used the raw public IP (churned daily →
#     tls-san re-rendered → `Restart k3s` every morning); MIN-54 moved to k8s.<domain>
#     (stable, but made a FREE domain load-bearing for kubectl - IRD-016 §Risk); MIN-50
#     removes the public endpoint, so no name is needed at all.
#     tls-san stays STATIC: 127.0.0.1 (explicit - k3s also adds it by default, but the
#     tunnel depends on it, so it is stated rather than assumed) + the server's PRIVATE
#     IP, appended by the role (the agent joins node-to-node on it). No domain names. ---
cluster_domain: taskmgmt.dpdns.org             # app ingress only (Route 53 A records) - NOT the API
k3s_api_host: 127.0.0.1                        # kubeconfig server address (via the SSM tunnel)
k3s_api_local_port: 6443                       # must match K3S_API_LOCAL_PORT in scripts/k8s-tunnel.sh
k3s_tls_san_static:
  - "{{ k3s_api_host }}"

# --- Argo CD bootstrap (pinned chart; root app-of-apps GATED off until D12 — Decision B).
#     Verify chart version at https://github.com/argoproj/argo-helm before Step 3. ---
argocd_namespace: platform
argocd_chart_version: "7.7.10"
argocd_bootstrap_root_app: true         # flipped at D12, 2026-09-22 — the `deploy` repo exists

# --- Local artifact (gitignored — P1-7). The fetched, URL-rewritten kubeconfig. ---
kubeconfig_local_path: "{{ playbook_dir }}/.artifacts/kubeconfig"
